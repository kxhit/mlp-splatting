name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install numpy imageio Pillow tqdm ninja pytest
          python -m pip install --no-deps -e .
      - name: Compile Python sources
        run: python -m compileall -q mip360 replica tools
      - name: Run CPU tests
        run: python -m pytest -q
      - name: Check installed CLIs
        run: |
          mlpsp-train --help >/dev/null
          mlpsp-train-replica --help >/dev/null
          mlpsp-eval-rgb --help >/dev/null
          mlpsp-eval-lseg --help >/dev/null
          mlpsp-benchmark --help >/dev/null
          mlpsp-convert-checkpoint --help >/dev/null
